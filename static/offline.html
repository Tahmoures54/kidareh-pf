<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E7490">
  <title>اتصال برقرار نیست | کی‌داره</title>
  <style>
    :root { color-scheme: light; font-family: Tahoma, Arial, sans-serif; background: #F1F5F9; color: #0F172A; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; padding: 24px; display: grid; place-items: center; }
    main { width: min(100%, 420px); padding: 28px; border: 1px solid #CBD5E1; border-radius: 24px; background: #FFFFFF; text-align: center; box-shadow: 0 18px 50px rgba(15,23,42,.08); }
    .mark { width: 64px; height: 64px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 20px; background: #0E7490; color: white; font-size: 34px; font-weight: 800; }
    h1 { margin: 0 0 12px; font-size: 1.35rem; }
    p { margin: 0 0 22px; color: #64748B; line-height: 1.9; }
    button { min-height: 46px; display: inline-flex; align-items: center; justify-content: center; padding: 0 20px; border: 0; border-radius: 12px; background: #0E7490; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    small { display: block; margin-top: 18px; color: #64748B; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">ک</div>
    <h1>فعلاً به اینترنت دسترسی نداریم</h1>
    <p>صفحه‌ها و امکانات فروشگاه برای دریافت اطلاعات تازه به اینترنت نیاز دارند. اتصال را بررسی کن و دوباره تلاش کن.</p>
    <button type="button" onclick="window.location.reload()">تلاش دوباره</button>
    <small>کی‌داره؛ ببین کی‌داره؟ حضوری بگیر!</small>
  </main>
</body>
</html>

{% extends "base.html" %}
{% block title %}جست‌وجوی کالاها | کی‌داره{% endblock %}
{% block content %}
<section class="page-heading"><span class="section-kicker">کشف انتخاب‌های تازه</span><h1>چی دنبالش می‌گردی؟</h1><p>بدون ساخت حساب، میان کالاها و خدمات جست‌وجو کن.</p></section>
<section class="page-panel">
  <form id="pageSearchForm" class="page-search"><label class="sr-only" for="pageQuery">جست‌وجو</label><input id="pageQuery" name="q" value="{{ query }}" placeholder="مثلاً گوشی، میز، خدمات فنی…"><select id="pageCategory" aria-label="دسته‌بندی"><option value="">همه دسته‌ها</option>{% for category in categories %}<option value="{{ category.id }}" {% if selected_category == category.id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select><input id="pageCity" name="city" value="{{ city }}" list="iranCityOptions" data-iran-location autocomplete="off" placeholder="شهر یا روستا"><datalist id="iranCityOptions"></datalist><button class="button button-primary" type="submit">جست‌وجو</button></form>
  <div class="page-results-head"><h2>نتایج جست‌وجو</h2><span id="pageResultsCount">در حال بارگذاری…</span></div>
  <div id="pageListings" class="page-card-grid" aria-live="polite"><div class="loading-card">در حال دریافت کالاها…</div></div>
</section>
{% endblock %}
{% block scripts %}<script>window.KIDAREH_PAGE={type:"search",query:{{ query|tojson }},category:{{ selected_category|tojson }},city:{{ city|tojson }}};</script>{% endblock %}

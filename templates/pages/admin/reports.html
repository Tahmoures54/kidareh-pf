{% extends "base.html" %}
{% block title %}گزارش‌های کاربران | کی‌داره{% endblock %}
{% block content %}<section class="page-heading"><span class="section-kicker">مدیریت محتوا</span><h1>گزارش‌های کاربران</h1><p>دسترسی فقط برای شماره تنظیم‌شده در ADMIN_PHONE مجاز است.</p></section><section class="page-panel"><div class="page-results-head"><h2>گزارش‌های باز</h2><button id="refreshReports" class="button button-outline" type="button">به‌روزرسانی</button></div><div id="adminReports" aria-live="polite">در حال بارگذاری…</div></section>{% endblock %}
{% block scripts %}<script>(()=>{const root=document.querySelector('#adminReports'),token=document.querySelector('meta[name="csrf-token"]')?.content||'';const labels={spam:'هرزنامه',fraud:'احتمال کلاهبرداری',wrong_info:'اطلاعات نادرست',prohibited:'محتوای نامناسب',other:'سایر'};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){root.textContent='در حال بارگذاری…';try{const r=await fetch('/api/admin/reports'),d=await r.json();if(!r.ok)throw Error(d.error==='admin_required'?'این حساب مدیر نیست؛ ADMIN_PHONE را بررسی کنید.':'دریافت گزارش‌ها ناموفق بود.');root.innerHTML=d.items.length?d.items.map(x=>'<article class="page-panel"><strong>گزارش '+x.id+' · '+(x.target_type==='listing'?'کالا':'فروشگاه')+' #'+x.target_id+'</strong><p>دلیل: '+(labels[x.reason]||x.reason)+'</p><p>'+esc(x.details||'بدون توضیح')+'</p><small>'+esc(x.reporter_name)+' · '+esc(x.created_at)+'</small><p><button class="button button-primary" data-resolve="'+x.id+'">بررسی شد</button>'+(x.target_type==='listing'?' <button class="button button-outline" data-hide="'+x.id+'">بررسی و حذف کالا</button>':'')+'</p></article>').join(''):'<p>گزارش بازی وجود ندارد.</p>';}catch(e){root.textContent=e.message;}}root.addEventListener('click',async e=>{const b=e.target.closest('[data-resolve],[data-hide]');if(!b)return;const hide=b.hasAttribute('data-hide');if(hide&&!confirm('کالای گزارش‌شده حذف شود؟'))return;const id=b.dataset.resolve||b.dataset.hide;const r=await fetch('/api/admin/reports/'+id,{method:'PATCH',headers:{'Content-Type':'application/json','X-CSRF-Token':token},body:JSON.stringify({status:'resolved',hide_target:hide})});if(r.ok)load();else alert('ثبت تغییر انجام نشد.');});document.querySelector('#refreshReports').addEventListener('click',load);load();})();</script>{% endblock %}

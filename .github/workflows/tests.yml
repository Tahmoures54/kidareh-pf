name: Flask Marketplace Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        # `scripts` is included so the maintenance and benchmark tools fail
        # the build on a syntax error like any shipped module.
        run: python -m compileall -q main.py kidareh tests scripts
      - name: Check JavaScript syntax
        # Every script is checked, not a hand-maintained list: seller.js shipped
        # with a syntax error for several releases because it was not listed.
        run: |
          find static -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run tests
        run: python -m pytest -q

name: Deploy Kidareh to Liara

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liara-production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test before deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q main.py kidareh tests

      - name: Check JavaScript syntax
        run: |
          node --check static/js/app.js
          node --check static/js/pages.js
          node --check static/js/location-picker.js

      - name: Run tests
        run: python -m pytest -q

  deploy:
    name: Deploy to Liara
    runs-on: ubuntu-latest
    needs: test
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for location data preparation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Liara CLI
        run: npm install --global @liara/cli@9

      - name: Deploy application
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          LIARA_APP_NAME: ${{ vars.LIARA_APP_NAME }}
        run: |
          if [ -z "$LIARA_API_TOKEN" ]; then
            echo "::error::Add LIARA_API_TOKEN to GitHub Actions secrets."
            exit 1
          fi
          if [ -z "$LIARA_APP_NAME" ]; then
            echo "::error::Add LIARA_APP_NAME to GitHub Actions variables (the exact Liara app ID)."
            exit 1
          fi
          # Match Liara's ingress port to the runtime's observed Gunicorn port.
          liara deploy \
            --api-token "$LIARA_API_TOKEN" \
            --app "$LIARA_APP_NAME" \
            --platform python \
            --port 3000 \
            --path . \
            --disks "app-data:/app/data" \
            --no-app-logs \
            --message "GitHub Actions ${GITHUB_SHA}"
